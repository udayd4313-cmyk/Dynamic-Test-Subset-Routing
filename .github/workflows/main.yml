
name: Dynamic Test Subset Routing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-routing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dynamic test router
        run: python scripts/test_router.py
